# Example bfsg-scanner configuration.
# Only baseUrl is required — every other field falls back to the default
# shown here if omitted.

baseUrl: "https://example.de"

# Origin the sitemap was generated for, when it differs from baseUrl's —
# e.g. a local or staging build whose sitemap.xml lists production URLs.
# Sitemap entries on this origin are rewritten onto baseUrl's origin, path
# and query kept. Without it, entries on another origin are skipped with a
# warning. A bare origin only, no path. Override on the CLI with
# --sitemap-origin. Unset by default.
# sitemapOrigin: "https://example.de"

# Maximum number of pages to scan (sitemap + crawl fallback combined).
maxPages: 50

# Milliseconds to wait after a page fires `load` before scanning it.
# 0 is right for a server-rendered site. Raise it (1000-3000) for a site
# that renders in the browser or fetches its translations after load, so
# the scan sees the hydrated page. Override on the CLI with --settle.
settleMs: 0

# axe-core rule sets to run. WCAG 2.1 AA is the legal baseline under
# EN 301 549 V3.2.1 / BFSG today. wcag21a and wcag21aa hold the Level A and
# AA criteria WCAG 2.1 added, so a WCAG 2.1 AA scan needs all four.
wcagTags:
  - wcag2a
  - wcag2aa
  - wcag21a
  - wcag21aa

# Paths excluded from crawling (glob-style, matched against the URL path).
excludePaths: []

# Directory the report files are written to.
outputDir: reports

# Which report files to write. Any non-empty subset of: json | html | pdf
# Override on the CLI with --format json,html,pdf
reportFormats:
  - json
  - html
  - pdf

# Minimum severity that causes the scan to exit 1.
# One of: critical | serious | moderate | minor
# A violation counts when its impact is at or above this level. Violations
# axe leaves unrated are warned about, not counted — see docs/adr/0003.
failOn: serious

# Language used for the generated report text. One of: de | en
reportLanguage: de

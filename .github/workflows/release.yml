name: Release

# Publishes to npm on a v* tag push via OIDC trusted publishing — no token.
#
# One-time setup on npmjs.com: bfsg-scanner -> Settings -> Trusted Publishing,
# add { user: MihaelaAghirculesei, repo: bfsg-scanner, workflow: release.yml }.
#
# A release is then: merge the version-bump PR, then
#   git tag vX.Y.Z && git push origin vX.Y.Z
# The tag must match package.json "version" or this job fails before publishing.

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release
  id-token: write # OIDC auth to npm; provenance is then automatic

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Use an npm that supports OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Check the tag matches package.json
        shell: bash
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Publish to npm
        run: npm publish --access public

      - name: Create the GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

name: Cross-platform

# The required `ci` check runs on Linux (ci.yml). This is an advisory run of
# the same verify + build on Windows and macOS, and on both the minimum
# supported Node (`engines.node`) and the version contributors develop on
# (`.nvmrc`), so a platform- or Node-version regression in the CLI or the
# build shows up on a PR without blocking it. Promote these to required
# checks in the branch ruleset if that ever becomes worthwhile.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: xplat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        # Minimum supported (engines.node) and the contributor version (.nvmrc).
        node: ['22', '24.19.0']
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.pw-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Verify (typecheck, lint, test)
        run: npm run verify

      - name: Build the publishable dist
        run: npm run build
